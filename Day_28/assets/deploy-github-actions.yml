name: CI/CD Deployment to Docker Swarm

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy-to-swarm:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Stack via SSH on Swarm Manager
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 172.16.7.42
          username: admin
          key: ${{ secrets.SWARM_SSH_PRIVATE_KEY }}
          envs: GITHUB_TOKEN
          script: |
            # Pull target image on Swarm Nodes & update the stack
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            docker service update --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest ticketsplease_web
